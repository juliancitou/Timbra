name: Android

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar proyecto Android
        id: project
        run: |
          if [ -f gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aún no existe gradlew; se omite la compilación."
          fi

      - uses: actions/setup-java@v6
        if: steps.project.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.project.outputs.exists == 'true'

      - name: Pruebas, lint y APK
        if: steps.project.outputs.exists == 'true'
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v7
        if: steps.project.outputs.exists == 'true'
        with:
          name: timbra-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Adjuntar APK al release
        if: steps.project.outputs.exists == 'true' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "timbra-$TAG.apk"
          gh release upload "$TAG" "timbra-$TAG.apk" --clobber
